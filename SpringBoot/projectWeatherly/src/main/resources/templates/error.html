<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 발생 - Weatherly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="error-container">
    <div class="error-icon">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 class="error-title">오류가 발생했습니다</h1>
    <p class="error-message" th:text="${errorMessage} ?: '요청을 처리하는 도중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.'"></p>

    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="/" class="btn-home">
            <i class="fas fa-home me-2"></i>홈으로 돌아가기
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary" style="border-radius: 25px; padding: 10px 30px;">
            <i class="fas fa-arrow-left me-2"></i>이전 페이지
        </a>
    </div>
</div>
</body>
</html>
