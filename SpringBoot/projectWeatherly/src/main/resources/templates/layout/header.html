<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Weatherly'">Weatherly</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header class="main-header" th:fragment="header">
    <div class="header-container">
        <div class="header-left">
            <a href="/" class="logo">
                <i class="fas fa-cloud-sun logo-icon"></i>
                <span class="logo-text">Weatherly</span>
            </a>
        </div>

        <nav class="header-center">
            <ul class="main-menu">
                <li><a href="/" class="menu-item"><i class="fas fa-home"></i> 홈</a></li>
                <li><a href="/fine-dust" class="menu-item"><i class="fas fa-wind"></i> 미세먼지</a></li>
                <li><a href="/outfit" class="menu-item"><i class="fas fa-tshirt"></i> 옷차림</a></li>
                <li><a href="/community" class="menu-item"><i class="fas fa-comments"></i> 커뮤니티</a></li>
                <li><a href="/insights" class="menu-item"><i class="fas fa-chart-line"></i> 기상 통계</a></li>

                <li sec:authorize="hasRole('ADMIN')">
                    <a href="/admin" class="menu-item"><i class="fas fa-cog"></i> 관리자</a>
                </li>
            </ul>
        </nav>

        <div class="header-right">
            <div class="user-greeting" sec:authorize="isAuthenticated()">
                <span class="greeting-text">안녕하세요, <strong th:text="${#authentication.principal.user.nickname}"></strong>님!</span>
            </div>

            <div class="control-buttons">
                <button class="control-btn notification-btn" title="알림" sec:authorize="isAuthenticated()">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notification-badge" style="display: none;">0</span>
                </button>
                <button class="control-btn favorites-btn" title="즐겨찾기" sec:authorize="isAuthenticated()">
                    <i class="fas fa-star"></i>
                </button>
                <button class="control-btn darkmode-toggle" id="darkmode-toggle" title="다크모드 전환" >
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <div class="dropdown">
                <button class="user-menu-btn">
                    <i class="fas fa-user-circle"></i>

                    <span sec:authorize="isAuthenticated()">마이페이지</span>

                    <span sec:authorize="isAnonymous()">로그인/가입</span>

                    <i class="fas fa-chevron-down"></i>
                </button>

                <div class="dropdown-content" sec:authorize="isAuthenticated()">
                    <a href="/mypage"><i class="fas fa-user"></i> 프로필설정</a>
                    <a href="/logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</a>
                </div>

                <div class="dropdown-content" sec:authorize="isAnonymous()">
                    <a href="/login"><i class="fas fa-sign-in-alt"></i> 로그인</a>
                    <a href="/signup"><i class="fas fa-user-plus"></i> 회원가입</a>
                </div>
            </div>
        </div>
    </div>

    <script sec:authorize="isAuthenticated()">
        document.addEventListener("DOMContentLoaded", function() {
            updateNotificationCount();

            // 10초마다 알림 갱신
            setInterval(updateNotificationCount, 10000);
        });

        function updateNotificationCount() {
            fetch('/api/notifications/count')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(count => {
                    const badge = document.getElementById('notification-badge');
                    if (count > 0) {
                        badge.innerText = count;
                        badge.style.display = 'inline-block'; // 뱃지 보이기
                    } else {
                        badge.style.display = 'none'; // 0개면 숨기기
                    }
                })
                .catch(error => console.error('알림 로드 실패:', error));
        }
    </script>
</header>
</body>
</html>
