<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오류 발생</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .error-container { max-width: 600px; margin: 0 auto; }
        h1 { color: #d32f2f; }
        .button {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>⚠️ 오류가 발생했습니다</h1>
    <p th:text="${error} ?: '서비스 처리 중 문제가 발생했습니다.'"></p>
    <p th:text="${message} ?: ''"></p>
    <a href="/" class="button">홈으로 이동</a>
    <a href="javascript:history.back()" class="button">이전 페이지</a>
</div>
</body>
</html>
