# ====================
# Spring Boot ?? ??
# ====================
spring.application.name=weatherly
server.port=8080
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# Secret properties ??
spring.config.import=optional:file:./secret.properties

# ====================
# ???? ??
# ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ====================
# ?????? ?? (H2 ???? - ???)
# ====================
spring.datasource.url=jdbc:h2:mem:weatherlydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
# password? secret.properties?? ??

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ====================
# JPA ??
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ====================
# H2 ??
# ====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ====================
# ?? ??
# ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ====================
# API ??
# ====================
weatherly.api.kma.url=http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weatherly.api.airkorea.url=http://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weatherly.api.kakao.url=https://dapi.kakao.com/v2/local
weatherly.api.ipinfo.url=http://ip-api.com/json

# ====================
# ??? ??
# ====================
weatherly.service.default-region=?????
weatherly.service.default-region-code=1100000000

# ====================
# ?? TTL ??
# ====================
weatherly.cache.weather.ttl=600          # 10?
weatherly.cache.airquality.ttl=300       # 5?
weatherly.cache.forecast.ttl=3600        # 1??

# ====================
# ???? ??
# ====================
weatherly.scheduler.weather.enabled=true
weatherly.scheduler.weather.cron=0 */10 * * * *
weatherly.scheduler.airquality.enabled=true
weatherly.scheduler.airquality.cron=0 */5 * * * *
weatherly.scheduler.forecast.enabled=true
weatherly.scheduler.forecast.cron=0 30 */3 * * *

# ====================
# ?? ??
# ====================
logging.level.me.shinsunyoung.projectweatherly=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.cache=TRACE

logging.file.name=logs/weatherly.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ====================
# HTTP ????? ??
# ====================
spring.webclient.timeout.connect=5000
spring.webclient.timeout.read=10000
spring.webclient.timeout.write=5000

# ====================
# ?? ??
# ====================
spring.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ====================
# ?? ??? ??
# ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================
# ??? ??
# ====================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=true

# ====================
# DevTools ??
# ====================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true


# ========================
# ?? ??? ??
# ========================
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/
# ========================
