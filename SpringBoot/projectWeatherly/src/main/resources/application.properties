# ??? ?? ??? ??? ??? ??
weatherly.kakao.map.key=DUMMY_KEY
# ====================
# Spring Boot \uAE30\uBCF8 \uC124\uC815
# ====================
spring.application.name=weatherly
server.port=8080
server.servlet.context-path=/
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.compression.enabled=true

# Secret properties \uD30C\uC77C \uC784\uD3EC\uD2B8
spring.config.import=optional:classpath:./secret.properties

# ====================
# \uD0C0\uC784\uB9AC\uD504 \uC124\uC815
# ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true
spring.thymeleaf.servlet.content-type=text/html

# \uC815\uC801 \uB9AC\uC18C\uC2A4 \uC124\uC815
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.web.resources.cache.period=3600
spring.mvc.static-path-pattern=/**

# ====================
# MariaDB \uC124\uC815
# ====================
spring.datasource.url=jdbc:mariadb://localhost:3306/weatherly_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# HikariCP \uCEE4\uB125\uC158 \uD480 \uC124\uC815
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=WeatherlyHikariCP
spring.datasource.hikari.connection-test-query=SELECT 1

# ====================
# JPA \uC124\uC815
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.use-new-id-generator-mappings=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ====================
# \uCE90\uC2DC \uC124\uC815
# ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,expireAfterAccess=5m

# ====================
# API URL \uC124\uC815
# ====================
weatherly.api.kma.url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weatherly.api.airkorea.url=https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weatherly.api.kakao.url=https://dapi.kakao.com
weatherly.api.ipinfo.url=http://ip-api.com/json

# ====================
# \uAE30\uBCF8 \uC9C0\uC5ED \uC124\uC815 (\uC5EC\uAE30\uAC00 \uC911\uC694!)
# ====================
weatherly.service.default-region=\uC11C\uC6B8\uD2B9\uBCC4\uC2DC
weatherly.service.default-region-code=1100000000
weather.default.location.name=\uC11C\uC6B8

# ====================
# \uCE90\uC2DC TTL \uC124\uC815
# ====================
weatherly.cache.weather.ttl=600          # 10\uBD84
weatherly.cache.airquality.ttl=300       # 5\uBD84
weatherly.cache.forecast.ttl=3600        # 1\uC2DC\uAC04

# ====================
# \uC2A4\uCF00\uC904\uB7EC \uC124\uC815
# ====================
weatherly.scheduler.weather.enabled=true
weatherly.scheduler.weather.cron=0 */10 * * * *
weatherly.scheduler.airquality.enabled=true
weatherly.scheduler.airquality.cron=0 */5 * * * *
weatherly.scheduler.forecast.enabled=true
weatherly.scheduler.forecast.cron=0 30 */3 * * *

# ====================
# \uB85C\uAE45 \uC124\uC815
# ====================
logging.level.me.shinsunyoung.projectweatherly=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.web.client.RestTemplate=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/weatherly.log
logging.file.max-size=10MB
logging.file.max-history=30

# ====================
# CORS \uC124\uC815
# ====================
cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ====================
# HTTP \uD074\uB77C\uC774\uC5B8\uD2B8 \uC124\uC815
# ====================
spring.webclient.timeout.connect=5000
spring.webclient.timeout.read=10000
spring.webclient.timeout.write=5000

# ====================
# \uBA54\uC778 \uC124\uC815
# ====================
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# ====================
# \uBCF4\uC548 \uC124\uC815
# ====================
spring.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# UTF-8 \uC778\uCF54\uB529 \uC124\uC815
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ====================
# \uD30C\uC77C \uC5C5\uB85C\uB4DC \uC124\uC815
# ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=C:\\upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
weatherly.upload.path=C:\\upload

# Jackson JSON \uC124\uC815
spring.jackson.time-zone=Asia/Seoul
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# DevTools \uC124\uC815
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true

# \uC2A4\uCF00\uC904\uB9C1 \uD480 \uC124\uC815
spring.task.scheduling.pool.size=10

# \uC138\uC158 \uC124\uC815
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ====================
# \uBA54\uC2DC\uC9C0 \uC18C\uC2A4 \uC124\uC815
# ====================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=true

# ============================================
# \uBA54\uC77C \uC124\uC815 (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

bcrypt.strength=10

# ============================================
# NAVER API \uB85C\uADF8\uC778
# ============================================
naver.client.authorization-grant-type=authorization_code
naver.client.redirect-uri=http://localhost:8080/login/oauth2/code/naver
naver.client.scope=name,email,profile_image
naver.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
naver.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
naver.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
naver.provider.naver.user-name-attribute=response

# ============================================
# Kakao API \uB85C\uADF8\uC778
# ============================================
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
kakao.client.redirect-uri=http://localhost:8080/login/oauth2/code/kakao