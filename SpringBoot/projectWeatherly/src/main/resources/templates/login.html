<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly - 로그인</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/signup.css">
</head>
<body>
<!-- 헤더 -->
<header  th:replace="layout/header :: header"></header>

<!-- 메인 컨텐츠 -->
<main class="signup-container">
    <div class="signup-card">
        <div class="signup-header">
            <h1><i class="fas fa-user-plus"></i> 로그인</h1>
            <p class="subtitle">Weatherly 회원이 되어 정확한 날씨 정보와 커뮤니티를 즐기세요</p>
        </div>

        <form id="loginForm" class="signup-form" th:action="@{/login}" method="post">
            <!-- 소셜 로그인 섹션 -->
            <div class="social-signup">
                <p class="social-title">소셜 계정으로 간편 로그인</p>
                <div class="social-buttons">
                    <button type="button" class="social-btn kakao" onclick="location.href='/oauth2/authorization/kakao'">
                        <i class="fas fa-comment"></i>카카오로 시작하기
                    </button>
                    <button type="button" class="social-btn naver" onclick="location.href='/oauth2/authorization/naver'">
                        <i class="fas fa-n"></i> 네이버로 시작하기
                    </button>
                    <button type="button" class="social-btn google" onclick="location.href='/oauth2/authorization/google'">
                        <i class="fab fa-google"></i> Google로 시작하기
                    </button>
                </div>
                <div class="divider">
                    <span>또는</span>
                </div>
            </div>

            <!-- 기본 정보 입력 -->
            <div class="form-section">
                <h2><i class="fas fa-id-card"></i> 로그인</h2>

                <div class="form-group">
                    <label for="user_id">아이디 <span class="required">*</span></label>
                    <div class="input-with-validation">
                        <input type="text" id="user_id" name="username" placeholder="예: mmm123" required>
                    </div>
                    <div class="validation-message" id="idMessage"></div>
                </div>




                <div class="form-group">
                    <label for="user_password">비밀번호 <span class="required">*</span></label>
                    <input type="password" id="user_password" name="password" placeholder="영문, 숫자, 특수문자 포함 8자 이상" required>
                    <div class="validation-message" id="passwordMessage"></div>
                </div>


            </div>
            <!-- 폼 버튼 -->
            <div class="form-buttons">
                <button type="submit" class="submit-btn">
                    <i class="fas fa-user-check"></i> 로그인
                </button>
                <button type="submit" class="cancel-btn" >
                    <i class="fas fa-times"></i> 취소
                </button>
            </div>

            <div class="login-link">
                계정이 없으신가요? <a href="/signup">회원가입</a>
            </div>
        </form>
    </div>
</main>

<!-- 푸터 -->
<div th:replace="layout/footer :: footer(footerInfo='기상청 API를 활용한 실시간 날씨 정보 서비스')"></div>

<script src="/js/singup.js"></script>
<script>
    // 다크모드 전환 (기존 스크립트 활용)
    document.getElementById('darkModeToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const icon = this.querySelector('i');
        if (document.body.classList.contains('dark-mode')) {
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        } else {
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
        }
    });
</script>
</body>
</html>
