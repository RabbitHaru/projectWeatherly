plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.shinsunyoung'
version = '0.0.1-SNAPSHOT'
description = 'projectWeatherly'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}
// QueryDSL 설정을 위한 변수 - 변수명 통일
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main.java.srcDirs += [querydslDir]
}

dependencies {
    // oauth2(oauth login) maando add
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'




    //    runtimeOnly 'mysql:mysql-connector-java' // 또는 실제 DB 사용시
    // runtimeOnly 'org.postgresql:postgresql' // PostgreSQL 사용시
    // 또는 MariaDB 사용 시
    // runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.1.4'


    // MariaDB 드라이버
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
// build.gradle (Gradle)
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'

    // 타임리프 레이아웃 및 확장
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.1.0'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // API 통신
    implementation 'org.springframework:spring-webflux'

    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // HTTP 클라이언트
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'

    // 캐시
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.1'

    // 파일 업로드
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'commons-fileupload:commons-fileupload:1.4'

    // 날씨 API 클라이언트
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // Geocoding
    implementation 'com.google.maps:google-maps-services:2.1.0'

    // API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Lombok + add (maando)
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // QueryDSL 의존성 추가 (필수)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    // Swagger(maando)add
    implementation 'io.springfox:springfox-boot-starter:3.0.0'
    implementation 'io.springfox:springfox-swagger-ui:3.0.0'
    // 개발 도구
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // 이메일
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

def queryDir = "$buildDir/generated/querydsl"
sourceSets {
    main.java.srcDirs += [queryDir]
}
tasks.withType(JavaCompiler){
    // options.getGeneratedSourceOutputDirectory().set(file(queryDir))
    options.generatedSourceOutputDirectory = file(querydslDir)
    // Java 17 호환성을 위한 설정
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
clean {
    delete file(queryDir)
}
tasks.named('test') {
    useJUnitPlatform()
}