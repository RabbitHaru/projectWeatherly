<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'글수정 - ' + ${board.title}">글수정 - Weatherly 커뮤니티</title>

    <!-- favicon 추가 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">

    <!-- Bootstrap CSS -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <link rel="stylesheet" th:href="@{/css/write.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/edit.css}">
</head>

<body>
<header th:replace="layout/header :: header"></header>

<!-- 글수정 헤더 섹션 -->
<div class="container">
    <div class="write-header-section weather-summary" >
        <h1 class="write-title " >글 수정</h1>
        <p class="write-subtitle" th:text="'「' + ${board.title} + '」 글을 수정합니다.'">게시글을 수정합니다.</p>
    </div>
</div>

<!-- 글수정 폼 -->
<div class="container">
    <form th:action="@{/community/boards/{id}/edit(id=${board.id})}" method="post" enctype="multipart/form-data" class="write-form-container">

        <!-- 수정된 CSRF 토큰 처리 -->
        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
               th:value="${_csrf != null ? _csrf.token : ''}" />

        <!-- 게시글 ID가 유효한지 확인 -->
        <input type="hidden" name="id" th:value="${board.id}">

        <!-- 제목 입력 -->
        <div class="form-group mb-4">
            <label for="title" class="form-label">
                <i class="fas fa-heading"></i> 제목
            </label>
            <input type="text" id="title" name="title" class="form-input"
                   th:value="${board.title}"
                   placeholder="제목을 입력해주세요 (최대 100자)" maxlength="100" required>
        </div>

        <!-- 카테고리 선택 -->
        <div class="form-group mb-4">
            <label class="form-label">
                <i class="fas fa-tag"></i> 카테고리
            </label>
            <div class="category-tags">
                <button type="button" class="category-tag weather"
                        th:classappend="${board.category == 'weather'} ? 'selected' : ''"
                        data-category="weather">
                    <i class="fas fa-cloud-sun"></i> 날씨
                </button>
                <button type="button" class="category-tag dust"
                        th:classappend="${board.category == 'dust'} ? 'selected' : ''"
                        data-category="dust">
                    <i class="fas fa-wind"></i> 미세먼지
                </button>
                <button type="button" class="category-tag outfit"
                        th:classappend="${board.category == 'outfit'} ? 'selected' : ''"
                        data-category="outfit">
                    <i class="fas fa-tshirt"></i> 옷차림
                </button>
                <button type="button" class="category-tag general"
                        th:classappend="${board.category == 'general'} ? 'selected' : ''"
                        data-category="general">
                    <i class="fas fa-comments"></i> 자유주제
                </button>
            </div>
            <input type="hidden" id="category" name="category" th:value="${board.category}">
        </div>

        <!-- 내용 입력 -->
        <div class="form-group mb-4">
            <label for="content" class="form-label">
                <i class="fas fa-edit"></i> 내용
            </label>
            <textarea id="content" name="content" class="form-textarea"
                      placeholder="내용을 작성해주세요 (최소 10자)" required
                      th:text="${board.content}"></textarea>
            <div class="text-end mt-2">
                <span class="text-muted" id="content-counter">
                    <span th:text="${#strings.length(board.content)}">0</span>자
                </span>
            </div>
        </div>

        <!-- 기존 이미지 표시 -->
        <div th:if="${board.images != null and not #lists.isEmpty(board.images)}" class="form-group mb-4">
            <label class="form-label">
                <i class="fas fa-images"></i> 기존 이미지
            </label>
            <div class="existing-images">
                <div class="existing-images-title">
                    현재 첨부된 이미지 (<span th:text="${#lists.size(board.images)}">0</span>개)
                </div>
                <div class="existing-images-list" id="existing-images-list">
                    <div th:each="image, stat : ${board.images}" class="existing-image-item">
                        <img th:src="@{/community/images/post/{image}(image=${image})}" alt="기존 이미지" onerror="this.style.display='none'">
                        <div class="existing-image-info">
                            <span>이미지 <span th:text="${stat.count}">1</span></span>
                            <label class="image-delete-checkbox">
                                <input type="checkbox" name="deleteImages" th:value="${image}">
                                <span>삭제</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 새 이미지 업로드 -->
        <div class="form-group mb-4">
            <label class="form-label">
                <i class="fas fa-image"></i> 새 이미지 추가 (선택사항)
            </label>
            <div class="file-upload" id="file-upload-area">
                <i class="fas fa-cloud-upload-alt"></i>
                <div class="file-upload-text">클릭하여 새 이미지 업로드</div>
                <div class="file-upload-hint">최대 5MB, JPG, PNG, GIF 파일 지원</div>
                <input type="file" id="image-upload" name="newImages" accept="image/*" multiple style="display: none;">
            </div>
            <div class="file-preview" id="file-preview"></div>
        </div>

        <!-- 버튼 그룹 -->
        <div class="button-group">
            <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> 수정 완료
            </button>
            <a th:href="@{'/community/boards/' + ${board.id}}" class="cancel-btn">
                <i class="fas fa-times"></i> 취소
            </a>
        </div>
    </form>
        </div>

<div th:replace="layout/footer :: footer"></div>

<!-- JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/edit.js}"></script>
<script th:src="@{/js/common.js}"></script>


</body>
</html>
