<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly - 로그인</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<header th:replace="layout/header :: header"></header>

<main class="signup-container">
    <div class="signup-card">
        <div class="signup-header weather-summary">
            <h1><i class="fas fa-sign-in-alt "></i> 로그인</h1>
            <p class="subtitle">Weatherly에 오신 것을 환영합니다</p>
        </div>

        <form id="loginForm" class="signup-form" th:action="@{/login}" method="post" novalidate>

            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-section">
                <div class="form-group">
                    <label for="user_id">아이디</label>
                    <div class="input-with-validation">
                        <input type="text" id="user_id" name="username" placeholder="이메일" required>
                    </div>
                    <div class="validation-message" id="idMessage"></div>
                </div>

                <div class="form-group">
                    <label for="user_password">비밀번호</label>
                    <input type="password" id="user_password" name="password" placeholder="비밀번호" required>
                    <div class="validation-message" id="passwordMessage"></div>
                </div>

                <div id="loginErrorMsg" class="error-box" th:classappend="${param.error} ? 'show' : ''">
                    <i class="fas fa-times-circle"></i>
                    <span>이메일 또는 비밀번호가 일치하지 않습니다.</span>
                </div>
            </div>

            <div class="form-buttons" style="margin-top: 0; margin-bottom: 15px;">
                <button type="submit" class="submit-btn" style="width: 100%;">
                    로그인
                </button>
            </div>

            <div class="login-actions">
                <label>
                    <input type="checkbox" name="remember-me">
                    <span>자동 로그인</span>
                </label>
                <div class="find-links">
                    <a href="/auth/find-account">이메일/비밀번호 찾기</a>
                </div>
            </div>

            <div class="social-signup" style="text-align: center;">
                <div class="divider">
                    <span>SNS 계정으로 로그인</span>
                </div>

                <div class="social-buttons" style="margin-top: 20px;">
                    <button type="button" class="social-btn naver" onclick="location.href='/oauth2/authorization/naver'">
                        <i class="fas fa-n"></i> 네이버 로그인
                    </button>
                    <button type="button" class="social-btn kakao" onclick="location.href='/oauth2/authorization/kakao'">
                        <i class="fas fa-comment"></i> 카카오 로그인
                    </button>
                    <button type="button" class="social-btn google" onclick="location.href='/oauth2/authorization/google'">
                        <i class="fab fa-google"></i> 구글 로그인
                    </button>
                </div>
            </div>

            <div class="login-link">
                아직 계정이 없으신가요? <a href="/signup">회원가입</a>
            </div>

        </form>
    </div>
</main>

<div th:replace="layout/footer :: footer(footerInfo='기상청 API를 활용한 실시간 날씨 정보 서비스')"></div>

<script src="/js/login.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
