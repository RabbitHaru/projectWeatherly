# ====================
# Spring Boot ?? ??
# ====================
spring.application.name=weatherly
server.port=8080
server.servlet.context-path=/
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.compression.enabled=true

# Secret properties ?? ???
spring.config.import=optional:classpath:./secret.properties

# ====================
# ???? ??
# ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true
spring.thymeleaf.servlet.content-type=text/html


# ?? ??? ??
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.web.resources.cache.period=3600
spring.mvc.static-path-pattern=/**

# ====================
# MariaDB
# ====================
spring.datasource.url=jdbc:mariadb://localhost:3306/weatherly_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234


# HikariCP ??? ? ??
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=WeatherlyHikariCP
spring.datasource.hikari.connection-test-query=SELECT 1

# ====================
# JPA ??
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.use-new-id-generator-mappings=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul




# ====================
# ?? ??
# ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,expireAfterAccess=5m

# ====================
# API URL ??
# ====================
weatherly.api.kma.url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weatherly.api.airkorea.url=https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weatherly.api.kakao.url=https://dapi.kakao.com
weatherly.api.ipinfo.url=http://ip-api.com/json

# ====================
# ?? ?? ??
# ====================
weatherly.service.default-region=?????
weatherly.service.default-region-code=1100000000

# ====================
# ?? TTL ??
# ====================
weatherly.cache.weather.ttl=600          # 10?
weatherly.cache.airquality.ttl=300       # 5?
weatherly.cache.forecast.ttl=3600        # 1??

# ====================
# ???? ??
# ====================
weatherly.scheduler.weather.enabled=true
weatherly.scheduler.weather.cron=0 */10 * * * *
weatherly.scheduler.airquality.enabled=true
weatherly.scheduler.airquality.cron=0 */5 * * * *
weatherly.scheduler.forecast.enabled=true
weatherly.scheduler.forecast.cron=0 30 */3 * * *

# ====================
# ?? ??
# ====================
logging.level.me.shinsunyoung.projectweatherly=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.cache=WARN

# API ?? ??
logging.level.org.springframework.web.client.RestTemplate=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/weatherly.log
logging.file.max-size=10MB
logging.file.max-history=30
# ====================
# CORS ??
# ====================
cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ====================
# HTTP ????? ??
# ====================
spring.webclient.timeout.connect=5000
spring.webclient.timeout.read=10000
spring.webclient.timeout.write=5000

# ====================
# ?? ??
# ====================
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true
# ====================
# ?? ??
# ====================
spring.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# UTF-8 ??? ??
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# ====================
# ?? ??? ??
# ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=C:\\upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
weatherly.upload.path=C:\\upload

# Jackson JSON ??
spring.jackson.time-zone=Asia/Seoul
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true

# ???? ??
spring.task.scheduling.pool.size=10

# ?? ??
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# HTTP/2 ?? (????)
# server.http2.enabled=true
# ====================
# ??? ??
# ====================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=true


# ============================================
# (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


bcrypt.strength=10

