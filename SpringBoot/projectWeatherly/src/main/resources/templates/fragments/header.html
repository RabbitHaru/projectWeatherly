<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- 헤더 영역 -->
<header class="main-header">
    <div class="header-container">
        <!-- 왼쪽: 로고 -->
        <div class="header-left">
            <a href="/" class="logo">
                <i class="fas fa-cloud-sun logo-icon"></i>
                <span class="logo-text">Weatherly</span>
            </a>
        </div>

        <!-- 가운데: 메인 메뉴 -->
        <nav class="header-center">
            <ul class="main-menu"  th:href="@{/}">
                <li><a href="/" class="menu-item" th:classappend="${requestURI.equals('/') or requestURI.equals('')} ? 'active' : ''"><i class="fas fa-home"></i>홈</a></li>
                <li><a href="/fine-dust" class="menu-item" th:classappend="${requestURI.contains('fine-dust')} ? 'active' : ''"><i class="fas fa-wind"></i>미세먼지</a></li>
                <li><a href="/outfit" class="menu-item" th:classappend="${requestURI.contains('outfit')} ? 'active' : ''"><i class="fas fa-tshirt"></i> 옷차림</a></li>
                <li><a href="/community" class="menu-item" th:classappend="${requestURI.contains('community')} ? 'active' : ''"><i class="fas fa-comments"></i>커뮤니티</a></li>
            </ul>
        </nav>

        <!-- 오른쪽: 사용자 컨트롤 -->
        <div class="header-right">
            <!-- 인사 메시지 -->
            <div class="user-greeting" sec:authorize="isAuthenticated()">
                <span class="greeting-text">안녕하세요, <strong th:text="${nickname}"></strong>님!</span>
            </div>

            <!-- 컨트롤 버튼들 -->
            <div class="control-buttons">
                <button class="control-btn notification-btn" title="알림">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">0</span>
                </button>

                <button class="control-btn favorites-btn" title="즐겨찾기">
                    <i class="fas fa-star"></i>
                </button>

                <button class="control-btn darkmode-toggle" id="darkmode-toggle" title="다크모드 전환">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <!-- 마이페이지 드롭다운 -->
            <div class="dropdown">
                <button class="user-menu-btn">
                    <i class="fas fa-user-circle"></i>
                    <span>마이페이지</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="dropdown-content" sec:authorize="isAuthenticated()">
                    <a href="/mypage"><i class="fas fa-user"></i> 프로필</a>
                    <a href="/settings"><i class="fas fa-cog"></i> 설정</a>
                    <a href="/favorites"><i class="fas fa-star"></i> 즐겨찾기</a>
                    <div class="dropdown-divider"></div>
                    <a href="/logout"><i class="fas fa-sign-out-alt"></i> 로그아웃</a>
                </div>
                <div class="dropdown-content" sec:authorize="isAnonymous()">
                    <a href="/login"><i class="fas fa-sign-out-alt"></i> 로그인</a>
                    <a href="/signup"><i class="fas fa-sign-out-alt"></i> 회원가입</a>
                </div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
