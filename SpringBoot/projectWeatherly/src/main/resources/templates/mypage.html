<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - Weatherly</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>

    </style>
</head>
<body>
<header th:replace="~{layout/header :: header}"></header>

<main class="container mypage-container" th:if="${myPage}">
    <div th:if="${message}" class="alert alert-success"><i class="fas fa-check"></i> <span th:text="${message}"></span></div>
    <div th:if="${error}" class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span></div>

    <div class="mypage-header">
        <h1><i class="fas fa-user-circle"></i> 마이페이지</h1>
        <p>내 정보를 관리하고 활동 내역을 확인하세요.</p>
    </div>

    <div class="mypage-grid">
        <aside class="profile-section">
            <div class="section-card">
                <div class="profile-view" id="profileView">
                    <div class="profile-img-wrapper" style="text-align: center; margin-bottom: 1rem;">
                        <img th:src="${myPage.profileImage} ?: '/images/default-profile.png'"
                             alt="프로필" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #f1f3f5;">
                    </div>
                    <h3 style="text-align: center; margin-bottom: 0.5rem;" th:text="${myPage.nickname}">닉네임</h3>
                    <p style="text-align: center; color: #868e96; margin-bottom: 1.5rem;" th:text="${myPage.email}">user@email.com</p>
                    <button class="btn btn-primary w-100" onclick="toggleEditMode(true)" style="width: 100%; padding: 10px; border-radius: 8px; border: none; background: #667eea; color: white; cursor: pointer;">
                        <i class="fas fa-edit"></i> 프로필 수정
                    </button>
                </div>

                <div class="profile-edit" id="profileEdit" style="display: none;">
                    <div class="section-title">프로필 수정</div>
                    <form th:action="@{/mypage/profile/edit}" method="post" enctype="multipart/form-data">
                        <div class="form-group text-center">
                            <label for="file" style="cursor: pointer;">
                                <img id="previewImage" th:src="${myPage.profileImage} ?: '/images/default-profile.png'"
                                     style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; opacity: 0.8;">
                                <div style="font-size: 0.8rem; color: #667eea; margin-top: 5px;">사진 변경 클릭</div>
                            </label>
                            <input type="file" id="file" name="file" accept="image/*" style="display: none;" onchange="previewFile(this)">
                        </div>

                        <div class="form-group">
                            <label class="form-label">닉네임</label>
                            <input type="text" name="nickname" class="form-input" th:value="${myPage.nickname}" required>
                        </div>

                        <div class="form-group" style="display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary" style="flex: 1; padding: 10px; border-radius: 8px; border: none; background: #667eea; color: white;">저장</button>
                            <button type="button" class="btn btn-secondary" onclick="toggleEditMode(false)" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #dee2e6; background: white;">취소</button>
                        </div>
                    </form>
                </div>
            </div>
        </aside>

        <div class="content-section">
            <div class="nav-tabs">
                <div class="nav-item active" onclick="switchTab('posts')">작성한 게시물</div>
                <div class="nav-item" onclick="switchTab('password')">비밀번호 변경</div>
                <div class="nav-item" onclick="switchTab('notification')">알림 설정</div>
                <div class="nav-item" onclick="switchTab('reports')">신고 내역</div>
            </div>

            <div id="tab-posts" class="tab-content active">
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-pen"></i> 내가 쓴 글</div>

                    <div th:if="${myPage.myCommunityPosts == null or myPage.myCommunityPosts.isEmpty()}" style="text-align: center; padding: 2rem; color: #868e96;">
                        작성한 게시물이 없습니다.
                    </div>

                    <div class="post-list" th:unless="${myPage.myCommunityPosts == null or myPage.myCommunityPosts.isEmpty()}">
                        <div th:each="post : ${myPage.myCommunityPosts}" style="display: flex; justify-content: space-between; padding: 1rem; border-bottom: 1px solid #f1f3f5; align-items: center;">
                            <div>
                                <a th:href="@{/community/boards/{id}(id=${post.postId})}" style="text-decoration: none; color: #333; font-weight: 500; font-size: 1.1rem;">
                                    <span th:text="${post.title}">게시글 제목</span>
                                </a>
                                <div style="font-size: 0.85rem; color: #868e96; margin-top: 5px;">
                                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2026-01-01</span> ·
                                    조회 <span th:text="${post.viewCount}">0</span> ·
                                    좋아요 <span th:text="${post.likeCount}">0</span>
                                </div>
                            </div>
                            <form th:action="@{/mypage/posts/{id}/delete(id=${post.postId})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                <button type="submit" style="background: none; border: none; color: #fa5252; cursor: pointer; font-size: 0.9rem;">
                                    <i class="fas fa-trash-alt"></i> 삭제
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-password" class="tab-content">
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-lock"></i> 비밀번호 변경</div>
                    <form th:action="@{/mypage/password/change}" method="post" th:object="${passwordRequest}">
                        <div class="form-group">
                            <label class="form-label">현재 비밀번호</label>
                            <input type="password" th:field="*{currentPassword}" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">새 비밀번호</label>
                            <input type="password" th:field="*{newPassword}" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">새 비밀번호 확인</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-input" required>
                        </div>
                        <button type="submit" class="btn" style="background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;">
                            비밀번호 변경
                        </button>
                    </form>
                </div>
            </div>

            <div id="tab-notification" class="tab-content">
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-bell"></i> 알림 설정</div>
                    <form th:action="@{/mypage/notifications}" method="post">
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
                            <input type="checkbox" th:field="${myPage.weatherAlertAgree}" id="weatherAlert">
                            <label for="weatherAlert">날씨 알림 수신 (중요 기상 특보 등)</label>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" th:field="${myPage.boardNotificationAgree}" id="boardNoti">
                            <label for="boardNoti">커뮤니티 활동 알림 (내 글 댓글 등)</label>
                        </div>
                        <button type="submit" class="btn" style="margin-top: 20px; background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;">
                            설정 저장
                        </button>
                    </form>
                </div>
            </div>

            <div id="tab-reports" class="tab-content">
                <div class="section-card">
                    <div class="section-title"><i class="fas fa-flag"></i> 신고 내역</div>
                    <div style="text-align: center; padding: 2rem; color: #868e96;">
                        <p>접수된 신고 내역이 없습니다.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="layout/footer :: footer(footerInfo='기상청 API를 활용한 실시간 날씨 정보 서비스')"></div>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/mypage.js}"></script>
</body>
</html>
