# ====================
# Spring Boot ?? ??
# ====================
spring.application.name=weatherly
server.port=8080
server.servlet.context-path=/
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# Secret properties ??
spring.config.import=optional:classpath:./secret.properties[.properties]

# ====================
# ???? ??
# ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true

# ====================
# MariaDB ?????? ??
# ====================
# MariaDB ?? ?? (??? ???, ??, DB? ??)
spring.datasource.url=jdbc:mariadb://localhost:3306/weatherly_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# ??? ? ?? (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ====================
# JPA ??
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================
# ?? ??
# ====================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,expireAfterAccess=5m

# ====================
# API URL ??
# ====================
weatherly.api.kma.url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weatherly.api.airkorea.url=https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
weatherly.api.kakao.url=https://dapi.kakao.com/v2/local
weatherly.api.ipinfo.url=http://ip-api.com/json

# ====================
# ?? ?? ??
# ====================
weatherly.service.default-region=?????
weatherly.service.default-region-code=1100000000

# ====================
# ?? ??
# ====================
logging.level.me.shinsunyoung.projectweatherly=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# API ?? ??
logging.level.org.springframework.web.client.RestTemplate=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ====================
# CORS ??
# ====================
cors.allowed-origins=http://localhost:8080,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ====================
# ?? ??
# ====================
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# UTF-8 ?? ??
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true